<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Downloads</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            min-height: 100dvh;
            background: linear-gradient(135deg, #000000, #444444);
            color: #fff;
            font-family: sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }
        .loader-line {
            width: 5%;
            height: 8px;
            background-color: dimgray;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            top: 100px;
            left: 0;
        }
        .loader-line::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 30%;
            background-color: snow;
            border-radius: 4px;
            animation: loading-bar 1.5s infinite ease-in-out;
        }
        @keyframes loading-bar {
            0% { left: -30%; }
            100% { left: 100%; }
        }
        .button-inner {
            position: absolute;
            align-self: center;
            top: 28%;
            left: 43.5%;
            transform: translate(-50%, -50%);
            display: block;
            width: min(75vw, 340px);
            height: auto;
            transition: transform 0.1s ease;

            .button-cash:active .button-inner {
                transform: scale(0.9);
            }

                animation: upDown 3s 0s infinite ease-in-out;
            }

            @keyframes upDown {
                0%, 100% { transform: translateY(0);}
                50%      { transform: translateY(-20px);}
            }
    </style>
</head>
<body>
<div class="loader-line"></div>
<img class="button-inner" src="https://www.pngarts.com/files/3/Silver-Coin-Free-PNG-Image.png" alt="Cash">

<script>
    setTimeout(() => {
        window.location.replace('HoraCliker.html');
    }, 2000);
</script>
</body>
</html>
